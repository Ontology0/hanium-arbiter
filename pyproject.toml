[project]
name = "hanium-arbiter"
version = "0.1.0"
description = "Ontology-aware human intervention for stalled agent collaboration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "mcp>=1.28,<2",
    "slack-sdk>=3,<4",
    "a2a-sdk>=0.3,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
